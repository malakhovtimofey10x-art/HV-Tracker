name: Update outbreak data

# Runs the agent on a 2-hour cadence. The cron uses UTC.
# You can also trigger it manually from the Actions tab.
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit data.json back to the repo
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet anthropic

      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python agent.py

      - name: Commit data.json if changed
        run: |
          git config user.name  "outbreak-bot"
          git config user.email "outbreak-bot@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No data changes — skipping commit."
          else
            STAMP=$(date -u '+%Y-%m-%dT%H:%MZ')
            git commit -m "auto: outbreak data $STAMP"
            git push
          fi
